plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace "com.example.ogdenkids"
    compileSdk 33

    defaultConfig {
        applicationId "com.example.ogdenkids"
        minSdk 23
        targetSdk 33
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 未配置时为空串，App 会回退到系统 TTS
        buildConfigField "String", "AZURE_SPEECH_KEY", "\"${localProps.getProperty("azure.speech.key", "")}\""
        buildConfigField "String", "AZURE_SPEECH_REGION", "\"${localProps.getProperty("azure.speech.region", "")}\""
        buildConfigField "String", "AZURE_TRANSLATOR_KEY", "\"${localProps.getProperty("azure.translator.key", "")}\""
        buildConfigField "String", "AZURE_TRANSLATOR_REGION", "\"${localProps.getProperty("azure.translator.region", "")}\""
        // 未配置时反馈入口提示不可用
        buildConfigField "String", "WECOM_FEEDBACK_WEBHOOK", "\"${localProps.getProperty("wecom.feedback.webhook", "")}\""
    }

    signingConfigs {
        release {
            // 密钥库与密码只在 local.properties，不进 git；丢了就无法给已安装的手机升级
            def storePath = localProps.getProperty("release.store.file")
            if (storePath != null) {
                storeFile rootProject.file(storePath)
                storePassword localProps.getProperty("release.store.password")
                keyAlias localProps.getProperty("release.key.alias")
                keyPassword localProps.getProperty("release.key.password")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2023.06.01")
    implementation "androidx.activity:activity-compose:1.7.2"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"

    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
